name: Publish and Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

# The root package.json holds the version; apps/cloud packs it into the
# @keetanetwork/explorer tarball that keeta-production installs.
env:
  EXPLORER_PACKED_TARBALL: packed-tarball
  EXPLORER_TARBALL_GLOB: keetanetwork-explorer-*.tgz

jobs:
  check-version-change:
    name: Check Version Change
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          # Get current version
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "Current version: $CURRENT_VERSION"

          # Get previous version (from parent commit)
          PREVIOUS_VERSION=$(git show HEAD~1:package.json | jq -r '.version' 2>/dev/null || echo "0.0.0")
          echo "Previous version: $PREVIOUS_VERSION"

          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          # Compare versions
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The release job also checks the tag, but by then the version is
      # already published, so a conflicting tag fails the run here first.
      - name: Check the release tag is free or on this commit
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tag="releases/v${{ steps.check.outputs.version }}"
          refs=$(git ls-remote --tags origin "refs/tags/${tag}" "refs/tags/${tag}^{}")
          if [ -z "$refs" ]; then
            echo "$tag does not exist yet"
            exit 0
          fi

          # An annotated tag lists its commit on the peeled ^{} line.
          tagged_commit=$(awk -v ref="refs/tags/${tag}^{}" '$2 == ref { print $1 }' <<< "$refs")
          if [ -z "$tagged_commit" ]; then
            tagged_commit=$(awk '{ print $1 }' <<< "$refs")
          fi
          if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
            echo "$tag already points at ${tagged_commit}, not ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "$tag already points at this commit"

  build:
    name: Build and pack
    needs: check-version-change
    if: needs.check-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # make dist writes dist/keetanetwork-explorer-cloud.tgz. The copy is
      # named after its version, which the release asset keeps.
      - name: Build and pack
        run: |
          set -euo pipefail
          make dist
          version=$(tar -xOzf dist/keetanetwork-explorer-cloud.tgz package/package.json | jq -r .version)
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "Packed version ${version} does not match package.json ${EXPECTED_VERSION}" >&2
            exit 1
          fi
          cp dist/keetanetwork-explorer-cloud.tgz "keetanetwork-explorer-${version}.tgz"
        env:
          EXPECTED_VERSION: ${{ needs.check-version-change.outputs.version }}

      # Publish and attest start on a new runner and read this tarball.
      - name: Upload the packed tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXPLORER_PACKED_TARBALL }}
          path: ${{ env.EXPLORER_TARBALL_GLOB }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to GitHub Package Registry
    needs: [check-version-change, build]
    runs-on: ubuntu-latest

    concurrency:
      group: publish-${{ needs.check-version-change.outputs.version }}
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@keetanetwork'

      - name: Download the packed tarball
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.EXPLORER_PACKED_TARBALL }}

      # Re-running a failed publish must not fail on a version that already
      # landed: skip an identical digest, fail on a different one. Recover
      # with "Re-run failed jobs", which reuses this tarball; "Re-run all
      # jobs" repacks it and can produce a different digest.
      - name: Publish to GitHub Package Registry
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=($EXPLORER_TARBALL_GLOB)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "No packed tarball on the runner" >&2
            exit 1
          fi

          for tarball in "${tarballs[@]}"; do
            package_json=$(tar -xOzf "$tarball" package/package.json)
            name=$(jq -r .name <<< "$package_json")
            version=$(jq -r .version <<< "$package_json")
            specifier="${name}@${version}"
            local_digest="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            view_log=$(mktemp)
            set +e
            remote_digest=$(npm view "$specifier" dist.integrity 2>"$view_log")
            view_status=$?
            set -e

            if [ "$view_status" -eq 0 ]; then
              if [ "$local_digest" = "$remote_digest" ]; then
                echo "$specifier is already on the registry with this digest"
                continue
              fi
              echo "$specifier is on the registry with a different digest" >&2
              echo "local=${local_digest}" >&2
              echo "registry=${remote_digest}" >&2
              exit 1
            fi

            if grep -q E404 "$view_log"; then
              npm publish "$tarball"
              continue
            fi

            cat "$view_log" >&2
            exit 1
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attest:
    name: Attest build provenance
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Download the packed tarball
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.EXPLORER_PACKED_TARBALL }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.EXPLORER_TARBALL_GLOB }}

  # The release is cut from the published tarball, so its tag sits on the
  # built commit and its SHA512 matches the registry. Notes come from
  # generate-notes, which lists the lower PRs of a merged stack.
  release:
    name: Create GitHub Release
    needs: [check-version-change, attest]
    runs-on: ubuntu-latest

    concurrency:
      group: create-release-${{ needs.check-version-change.outputs.version }}
      cancel-in-progress: false

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the packed tarball
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.EXPLORER_PACKED_TARBALL }}

      # A re-run exits early when the release already exists.
      - name: Create GitHub Release
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=($EXPLORER_TARBALL_GLOB)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected one packed tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          package_json=$(tar -xOzf "$tarball" package/package.json)
          name=$(jq -r .name <<< "$package_json")
          version=$(jq -r .version <<< "$package_json")
          tag="releases/v${version}"

          # An interrupted create leaves a draft, which is replaced.
          view_log=$(mktemp)
          if release=$(gh release view "$tag" --json databaseId,isDraft 2>"$view_log"); then
            if [ "$(jq -r .isDraft <<< "$release")" != true ]; then
              echo "$tag is already released"
              exit 0
            fi
            # Delete by ID: a lookup by tag can resolve to a published release.
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$(jq -r .databaseId <<< "$release")"
          elif ! grep -q 'release not found' "$view_log"; then
            cat "$view_log" >&2
            exit 1
          fi

          # gh release create ignores --target when the tag already exists.
          # check-version-change ran this check before publish; repeat it for a
          # tag pushed while the run was in progress.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit=$(git rev-parse "refs/tags/${tag}^{commit}")
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "$tag already points at ${tagged_commit}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

          digest=$(openssl dgst -sha512 -r "$tarball" | awk '{ print toupper($1) }')

          notes_args=(-f tag_name="$tag" -f target_commitish="$GITHUB_SHA")
          if previous_tag=$(git describe --tags --abbrev=0 --match 'releases/v*' "${GITHUB_SHA}^" 2>/dev/null); then
            notes_args+=(-f previous_tag_name="$previous_tag")
          fi
          # The release page shows a full PR URL as is, so shorten it to #N, which it links.
          generated=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${notes_args[@]}" --jq .body \
            | sed -E "s@ in https://github\.com/${GITHUB_REPOSITORY}/pull/([0-9]+)\$@ in #\1@")

          {
            echo "This is Explorer v${version} which has the following changes:"
            echo
            echo "$generated"
            echo
            echo 'It includes the following release artifacts:'
            echo 'NPM Packages:'
            echo '```'
            echo "        ${name}@${version}          SHA512: ${digest}"
            echo '```'
          } > release-notes.md

          # Only the highest version is latest, so a late run for an older
          # version does not demote a newer release.
          highest_tag=$(git tag -l 'releases/v*' | { cat; echo "$tag"; } | sort -V | tail -n 1)
          latest=false
          if [ "$highest_tag" = "$tag" ]; then
            latest=true
          fi

          gh release create "$tag" "$tarball" \
            --target "$GITHUB_SHA" \
            --title "v${version}" \
            --notes-file release-notes.md \
            --latest="$latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
