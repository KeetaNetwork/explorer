name: Deploy

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

  workflow_dispatch:
    inputs:
      pulumi:
        description: 'Deploy Pulumi'
        required: false
        default: false
        type: boolean

jobs:
  pulumi:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.merged) || (github.event_name == 'workflow_dispatch' && github.event.inputs.pulumi == 'true') }}
    name: Pulumi
    uses: ./.github/workflows/_deploy_pulumi.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: read
      pull-requests: write
